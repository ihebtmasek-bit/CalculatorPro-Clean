name: Build Android App

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      
    - name: Build release APK
      run: |
        chmod +x gradlew
        ./gradlew assembleRelease
        
    - name: Find and upload APK
      run: |
        APK_FILE=$(find . -name "*.apk" -type f | grep release | head -1)
        echo "Release APK found: $APK_FILE"
        
        if [ -n "$APK_FILE" ]; then
          cp "$APK_FILE" ./z-calculator.apk
          echo "APK ready for upload"
        else
          echo "No APK found! Listing all APKs:"
          find . -name "*.apk" -type f
          exit 1
        fi
        
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: z-calculator-app
        path: z-calculator.apk
        retention-days: 30
