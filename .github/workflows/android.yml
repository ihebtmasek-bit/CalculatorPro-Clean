name: Android Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      
    - name: Set up JDK 11
      uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: 'temurin'
        
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
      
    - name: Build Debug APK & AAB
      run: |
        ./gradlew assembleDebug
        ./gradlew bundleDebug
        
    - name: Build Release AAB (Signed)
      run: |
        # Créer un keystore de debug pour les tests
        keytool -genkey -v -keystore debug.keystore \
          -storepass android -alias androiddebugkey \
          -keypass android -keyalg RSA -keysize 2048 \
          -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
        
        ./gradlew bundleRelease
      env:
        KEY_STORE_FILE: debug.keystore
        KEY_STORE_PASSWORD: android
        ALIAS: androiddebugkey
        ALIAS_PASSWORD: android
        
    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: debug-apk
        path: app/build/outputs/apk/debug/
        
    - name: Upload Debug AAB
      uses: actions/upload-artifact@v4
      with:
        name: debug-aab
        path: app/build/outputs/bundle/debug/
        
    - name: Upload Release AAB
      uses: actions/upload-artifact@v4
      with:
        name: release-aab
        path: app/build/outputs/bundle/release/
