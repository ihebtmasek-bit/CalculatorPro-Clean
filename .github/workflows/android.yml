name: Build Signed Z-Calculator

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        
    - name: Generate release keystore
      run: |
        keytool -genkey -v \
          -keystore zcalculator.keystore \
          -alias zcalculator \
          -keyalg RSA \
          -keysize 2048 \
          -validity 10000 \
          -storepass zcalculator123 \
          -keypass zcalculator123 \
          -dname "CN=Z-Calculator, OU=Android, O=Z-Calculator, L=Paris, ST=France, C=FR"
        
    - name: Build signed APK and AAB
      run: |
        chmod +x gradlew
        ./gradlew assembleRelease
        ./gradlew bundleRelease
        
    - name: Upload signed APK
      uses: actions/upload-artifact@v4
      with:
        name: z-calculator-signed-apk
        path: app/build/outputs/apk/release/*.apk
        
    - name: Upload signed AAB
      uses: actions/upload-artifact@v4
      with:
        name: z-calculator-signed-aab
        path: app/build/outputs/bundle/release/*.aab
        
    - name: Upload keystore (backup)
      uses: actions/upload-artifact@v4
      with:
        name: z-calculator-keystore
        path: zcalculator.keystore
