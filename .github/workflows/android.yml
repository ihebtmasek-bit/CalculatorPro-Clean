name: Android Build API 35

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-latest  # macOS a souvent moins de problèmes
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        
    - name: Setup Android SDK 35
      uses: android-actions/setup-android@v3
      
    - name: Build AAB
      run: |
        chmod +x gradlew
        ./gradlew clean bundleRelease --no-daemon --stacktrace
        
    - name: Upload AAB
      uses: actions/upload-artifact@v4
      with:
        name: calculator-aab-api35-macos
        path: app/build/outputs/bundle/release/
