plugins {
    id 'com.android.application'
}

android {
    compileSdk 34  # Compiler avec une version stable
    namespace 'com.zcalculator.app'

    defaultConfig {
        applicationId "com.zcalculator.app"
        minSdk 21
        targetSdk 34  # Target égal à compile pour stabilité
        versionCode 9
        versionName "2.2"
    }

    signingConfigs {
        release {
            storeFile file('webview-app.keystore')
            storePassword 'webview123456'
            keyAlias 'webview'
            keyPassword 'webview123456'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    
    // Override pour Google Play
    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            def versionCodes = ["armeabi-v7a": 1, "x86": 2, "arm64-v8a": 3, "x86_64": 4]
            output.versionCodeOverride = versionCodes.get(output.getFilter("ABI"), 0) * 1000000 + defaultConfig.versionCode
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
}
