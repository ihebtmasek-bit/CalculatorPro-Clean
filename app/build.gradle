plugins {
    id 'com.android.application'
}

android {
    compileSdk 35
    namespace 'com.zcalculator.app'

    defaultConfig {
        applicationId "com.zcalculator.app"
        minSdk 21
        targetSdk 35
        versionCode 1
        versionName "1.0"
    }

    signingConfigs {
        release {
            storeFile file("${System.env.KEY_STORE_FILE ?: 'debug.keystore'}")
            storePassword System.env.KEY_STORE_PASSWORD ?: "android"
            keyAlias System.env.ALIAS ?: "androiddebugkey"
            keyPassword System.env.ALIAS_PASSWORD ?: "android"
        }
    }

    buildTypes {
        debug {
            // Build debug simple
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // Désactiver aapt2 si problème
    aaptOptions {
        ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.webkit:webkit:1.10.0'
}
