plugins {
    id 'com.android.application'
}

android {
    compileSdk 33
    namespace 'com.zcalculator.app'

    defaultConfig {
        applicationId "com.zcalculator.app"
        minSdk 21
        targetSdk 33
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        debug {
            // Signé automatiquement par le keystore debug d'Android
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Ne pas configurer signingConfig pour release - on utilise debug pour tester
        }
    }
    
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
}
